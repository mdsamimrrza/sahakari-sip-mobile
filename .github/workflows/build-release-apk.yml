name: Build & attach release APK

on:
  push:
    tags:
      - 'v*'          # fires on every tag like v1.0.0, v2.3.1, etc.
  release:
    types: [published] # also fires when a release is published via the GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing keystore (or auto-generate one if secrets are absent)
        env:
          KEYSTORE_BASE64:    ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD:  ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:          ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:       ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using repository keystore secret"
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
              > android/keystore.properties
          else
            echo "No KEYSTORE_BASE64 secret — generating a self-signed keystore"
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias sahakarisip \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android123 \
              -keypass  android123 \
              -dname "CN=SahakariSIP, OU=Mobile, O=SahakariSIP, L=Kathmandu, S=Bagmati, C=NP"
            printf 'storeFile=release.keystore\nstorePassword=android123\nkeyAlias=sahakarisip\nkeyPassword=android123\n' \
              > android/keystore.properties
          fi

      - name: Write app .env (Supabase — optional, app works without it)
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\nEXPO_PUBLIC_DEFAULT_DATA_MODE=local\n' \
            "${SUPABASE_URL:-}" "${SUPABASE_ANON_KEY:-}" > .env

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Resolve tag name
        id: tag
        run: |
          # works for both push/tag and release events
          TAG="${GITHUB_REF_NAME:-}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          cp "$SRC" "SahakariSIP-${TAG}.apk"
          cp "$SRC" "SahakariSIP.apk"
          gh release upload "$TAG" \
            "SahakariSIP-${TAG}.apk" \
            "SahakariSIP.apk" \
            --clobber --repo "$GITHUB_REPOSITORY"
